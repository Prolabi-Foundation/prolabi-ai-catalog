name: Validate catalog operations

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out catalog operations
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install catalog tooling
        run: npm ci

      - name: Validate repository policy and tooling
        run: npm test
